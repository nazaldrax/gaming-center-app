{% extends "base.html" %}

{% block title %}Members - Gaming Center Management{% endblock %}

{% block content %}
<div class="py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-gradient"><i class="fas fa-users"></i> Member Management</h1>
        <button class="btn btn-neon-green" data-bs-toggle="modal" data-bs-target="#addMemberModal">
            <i class="fas fa-user-plus me-2"></i>Add New Member
        </button>
    </div>

    <!-- Add Member Modal -->
    <div class="modal fade" id="addMemberModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content dark-modal">
                <div class="modal-header border-neon-green">
                    <h5 class="modal-title"><i class="fas fa-user-plus me-2 text-neon-green"></i>Register New Member</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="memberForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="memberName" placeholder="Enter full name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mobile Number <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="memberMobile" placeholder="Enter 10-digit mobile number" maxlength="10" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" id="memberAddress" rows="3" placeholder="Enter address (optional)"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-neon-green">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-neon-green" id="saveMemberBtn">Save Member</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Search & Filter -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="input-group">
                <input type="text" class="form-control" id="searchInput" placeholder="Search by name or mobile...">
                <button class="btn btn-neon-blue" type="button" id="searchBtn">
                    <i class="fas fa-search me-1"></i>Search
                </button>
            </div>
        </div>
    </div>

    <!-- Members Table -->
    <div class="card dark-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead class="table-header-gaming">
                        <tr>
                            <th><i class="fas fa-user-circle me-2"></i>Name</th>
                            <th><i class="fas fa-phone me-2"></i>Mobile</th>
                            <th><i class="fas fa-map-marker-alt me-2"></i>Address</th>
                            <th><i class="fas fa-calendar me-2"></i>Joined</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="membersTableBody">
                        <tr>
                            <td colspan="5" class="text-center text-muted py-4">
                                <i class="fas fa-spinner fa-spin me-2"></i>Loading members...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Load members on page load
window.addEventListener('load', loadMembers);

function loadMembers() {
    fetch('/api/members')
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('membersTableBody');
            tbody.innerHTML = '';
            
            if (data.data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-muted py-4">
                            <i class="fas fa-inbox me-2"></i>No members registered yet
                        </td>
                    </tr>
                `;
                return;
            }
            
            data.data.forEach(member => {
                const row = document.createElement('tr');
                const joined = new Date(member.created_at).toLocaleDateString();
                row.innerHTML = `
                    <td><strong>${member.name}</strong></td>
                    <td>${member.mobile}</td>
                    <td>${member.address || '-'}</td>
                    <td>${joined}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-neon-blue" onclick="editMember(${member.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-neon-green" onclick="viewMemberSessions(${member.id})">
                            <i class="fas fa-history"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        });
}

// Add new member
document.getElementById('saveMemberBtn').addEventListener('click', function() {
    const name = document.getElementById('memberName').value.trim();
    const mobile = document.getElementById('memberMobile').value.trim();
    const address = document.getElementById('memberAddress').value.trim();
    
    if (!name || !mobile) {
        alert('Please fill in all required fields');
        return;
    }
    
    if (!/^\d{10}$/.test(mobile)) {
        alert('Please enter a valid 10-digit mobile number');
        return;
    }
    
    fetch('/api/members', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, mobile, address})
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            alert('Member registered successfully!');
            document.getElementById('memberForm').reset();
            bootstrap.Modal.getInstance(document.getElementById('addMemberModal')).hide();
            loadMembers();
        } else {
            alert('Error: ' + data.error);
        }
    });
});

// Search functionality
document.getElementById('searchBtn').addEventListener('click', function() {
    const query = document.getElementById('searchInput').value;
    if (!query.trim()) {
        loadMembers();
        return;
    }
    
    fetch(`/api/members/search?q=${encodeURIComponent(query)}`)
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('membersTableBody');
            tbody.innerHTML = '';
            
            if (data.data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-muted py-4">
                            No members found
                        </td>
                    </tr>
                `;
                return;
            }
            
            data.data.forEach(member => {
                const row = document.createElement('tr');
                const joined = new Date(member.created_at).toLocaleDateString();
                row.innerHTML = `
                    <td><strong>${member.name}</strong></td>
                    <td>${member.mobile}</td>
                    <td>${member.address || '-'}</td>
                    <td>${joined}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-neon-blue" onclick="editMember(${member.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        });
});

function editMember(memberId) {
    alert('Edit functionality coming soon!');
}

function viewMemberSessions(memberId) {
    alert('Session history coming soon!');
}
</script>
{% endblock %}
